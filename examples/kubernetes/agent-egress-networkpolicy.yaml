# Recommended (defense-in-depth) egress NetworkPolicy for agent pods.
#
# This is NOT part of the default Kustomization base and nothing in the
# enrollment path depends on it. The bridge sends only the default route
# through the tunnel. Other routes, such as the CNI's Pod routes and
# `tunnel_split_cidrs`, stay outside the tunnel. This policy adds a
# cluster-enforced layer that allows only enrollment, the WireGuard tunnel,
# and DNS. For a policy without the DNS rule, see the lockdown component in
# ../lockdown.
#
# REVIEW THESE FIXED DEPLOYMENT ASSUMPTIONS BEFORE APPLYING:
#
# Workload selection:
#   - Policy namespace: `agents`.
#   - Pod selector: `clawpatrol.dev/profile: default`.
#   - Every matching Pod becomes default-deny for egress except for the rules
#     below. Narrow or broaden the selector to match the workloads that should
#     use Clawpatrol.
#
# Gateway path:
#   - Gateway namespace: `clawpatrol`, selected through the standard
#     `kubernetes.io/metadata.name` namespace label.
#   - Gateway Pod label: `app: clawpatrol-gateway`.
#   - Gateway API: TCP 8080.
#   - WireGuard endpoint: UDP 51820.
#   - If the bridge enrolls through the gateway public_url behind a TLS
#     ingress, allow egress to that ingress instead of (or as well as) the
#     gateway API rule below.
#
# DNS path:
#   - DNS namespace: `kube-system`.
#   - DNS Pod label: `k8s-app: kube-dns`.
#   - DNS ports: UDP and TCP 53.
#   - Replace these selectors if the cluster uses different CoreDNS/kube-dns
#     labels or an external DNS service.
#   - The workload can also use this rule to query kube-dns Pods directly,
#     outside the tunnel. The lockdown component removes the rule.
#
# Enforcement behavior:
#   - The CNI must enforce NetworkPolicy, such as Calico, Cilium, or kind's
#     default kindnet (kind v0.24 and later). On a CNI that does not, this
#     manifest has no effect.
#   - Once the tunnel is up, traffic on the default route leaves the Pod as
#     WireGuard traffic to the gateway. If the tunnel drops, the bridge
#     removes the default route, so that traffic fails closed. Traffic on
#     other routes does not change.
#   - Add explicit rules before applying if matching workloads need other
#     direct cluster services, metadata endpoints, or control planes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clawpatrol-agent-egress
  namespace: agents
spec:
  # Scope to enrollment agents. Narrow this podSelector if the namespace also
  # runs pods that should keep unrestricted egress.
  podSelector:
    matchLabels:
      clawpatrol.dev/profile: default
  policyTypes:
    - Egress
  egress:
    # clawpatrol gateway: API + WireGuard endpoint.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: clawpatrol
          podSelector:
            matchLabels:
              app: clawpatrol-gateway
      ports:
        - protocol: TCP
          port: 8080
        - protocol: UDP
          port: 51820
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
